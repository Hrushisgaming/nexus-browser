<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chat with Nexus</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="sidepanel.css"></head>
<body>
  <header>
    <img src="icons/glyph.png" alt="" width="22" height="22">
    <h1>Nexus</h1>
    <button id="bNew" class="ib" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    <button id="bHist" class="ib" title="Chat history" aria-label="Chat history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
    <button id="bPop" class="ib" title="Open in its own window" aria-label="Pop out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
    <button id="bSet" class="ib" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </header>
  <nav id="tabs" aria-label="Chat source"></nav>
  <section id="paneChat" class="pane">
    <div id="msgs" aria-live="polite"></div>
    <footer>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask Nexus" aria-label="Message"></textarea>
        <button id="bSend" class="send" aria-label="Send" title="Send"></button>
      </div>
      <div id="chips"></div>
    </footer>
  </section>
  <section id="paneWeb" class="pane"><div id="webbar"></div><div id="frames"></div></section>
  <section id="paneHist" class="pane scroll"></section>
  <section id="paneSet" class="pane scroll"></section>
  <div id="toasts"></div>
  <script type="module" src="sidepanel.js"></script>
</body></html>
