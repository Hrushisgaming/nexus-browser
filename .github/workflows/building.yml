name: Building Nexus for macOS

defaults:
  run:
    shell: bash
    working-directory: helium-macos

permissions:
  actions: read
  contents: read

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      resume_run_id:
        required: false
        type: string
        default: ""

jobs:
  retrieve-resources:
    name: Retrieve resources required for building
    if: ${{ inputs.resume_run_id == '' }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/prepare-environment
      - name: Download Chromium, apply patches, stage Nexus Vault and Proton VPN
        run: |
          set -o pipefail
          source ./devutils/shared.sh
          prepare_sources '${{ inputs.arch }}' false | tee -a github_actions_retrieve_resources.log
          rm -rf build/download_cache
      - name: Check the Nexus built-ins were staged
        run: |
          test -f build/src/third_party/nexus_builtin/vault/manifest.json
          test -f build/src/third_party/nexus_builtin/proton_vpn/manifest.json
          test -f build/src/third_party/nexus_builtin/BUILD.gn
      - name: Archive resources
        run: ./github_pack_resources.sh | tee -a github_actions_retrieve_resources.log
      - name: Upload resources
        uses: actions/upload-artifact@v4
        with:
          name: nexus_macos_resources_${{ inputs.arch }}
          path: helium-macos/upload_build_resources/

  build_job_01:
    needs: retrieve-resources
    if: ${{ !cancelled() && (needs.retrieve-resources.result == 'success' || needs.retrieve-resources.result == 'skipped') }}
    uses: ./.github/workflows/build-phase.yml
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: ${{ inputs.resume_run_id != '' }}
      resume_run_id: ${{ inputs.resume_run_id }}

  build_job_02:
    needs: build_job_01
    if: ${{ !cancelled() && needs.build_job_01.result == 'success' && needs.build_job_01.outputs.status == 'running' }}
    uses: ./.github/workflows/build-phase.yml
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_03:
    needs: build_job_02
    if: ${{ !cancelled() && needs.build_job_02.result == 'success' && needs.build_job_02.outputs.status == 'running' }}
    uses: ./.github/workflows/build-phase.yml
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_04:
    needs: build_job_03
    if: ${{ !cancelled() && needs.build_job_03.result == 'success' && needs.build_job_03.outputs.status == 'running' }}
    uses: ./.github/workflows/build-phase.yml
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_05:
    needs: build_job_04
    if: ${{ !cancelled() && needs.build_job_04.result == 'success' && needs.build_job_04.outputs.status == 'running' }}
    uses: ./.github/workflows/build-phase.yml
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_06:
    needs: build_job_05
    if: ${{ !cancelled() && needs.build_job_05.result == 'success' && needs.build_job_05.outputs.status == 'running' }}
    uses: ./.github/workflows/build-phase.yml
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_07:
    needs: build_job_06
    if: ${{ !cancelled() && needs.build_job_06.result == 'success' && needs.build_job_06.outputs.status == 'running' }}
    uses: ./.github/workflows/build-phase.yml
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_08:
    needs: build_job_07
    if: ${{ !cancelled() && needs.build_job_07.result == 'success' && needs.build_job_07.outputs.status == 'running' }}
    uses: ./.github/workflows/build-phase.yml
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_09:
    needs: build_job_08
    if: ${{ !cancelled() && needs.build_job_08.result == 'success' && needs.build_job_08.outputs.status == 'running' }}
    uses: ./.github/workflows/build-phase.yml
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true

  build_job_10:
    needs: build_job_09
    if: ${{ !cancelled() && needs.build_job_09.result == 'success' && needs.build_job_09.outputs.status == 'running' }}
    uses: ./.github/workflows/build-phase.yml
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      resume: true
